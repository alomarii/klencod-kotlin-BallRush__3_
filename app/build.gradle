plugins {
    id 'com.android.application'
}
android {
    namespace 'com.omari.ballrush'
    compileSdk 34
    defaultConfig {
        applicationId "com.omari.ballrush"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
